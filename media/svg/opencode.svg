<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="300"
   height="300"
   viewBox="0 0 300 300"
   fill="none"
   version="1.1"
   id="svg5"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g
     transform="translate(30, 0)"
     id="g5">
    <!-- Middle solid square (unchanged): 60..180 x, 120..240 y, gray fill -->
    <path
       d="M180 240H60V120H180V240Z"
       fill="#CFCECD"
       id="path-middle" />
    <!-- Inner rectangle outline: traces the original frame's inner
         cutout (60..180 x, 60..240 y, 120x180 - same 60-unit offset
         on every side as the outer 240x300). Inset by 5 + stroke-width
         10 puts the entire stroke band exactly along that boundary,
         drawn inward. -->
    <rect
       x="65"
       y="65"
       width="110"
       height="170"
       fill="none"
       stroke="#211E1E"
       stroke-width="10"
       id="rect-inner" />
    <!-- Outer box outline: 10-unit stroke, inset by 5 so the entire
         stroke fits inside the original 240x300 footprint. -->
    <rect
       x="5"
       y="5"
       width="230"
       height="290"
       fill="none"
       stroke="#211E1E"
       stroke-width="10"
       id="rect-outline" />
  </g>
</svg>
